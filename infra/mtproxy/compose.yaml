services:
  mtproxy:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "443:8443/tcp"
    environment:
      MTPROXY_SECRET: ${MTPROXY_SECRET:?Set MTPROXY_SECRET in .env}
      MTPROXY_PORT: 8443
      MTPROXY_WORKERS: ${MTPROXY_WORKERS:-1}
      MTPROXY_TAG: ${MTPROXY_TAG:-}
    volumes:
      - mtproxy-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

volumes:
  mtproxy-data:
